name: Validate launchers

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n install.sh
          bash -n desktops/kiran/files/kiran-x410
          bash -n desktops/kiran/files/kiran-x410-session
      - name: Check whitespace
        run: git diff --check
